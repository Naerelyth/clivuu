[package]
name = "clivuu-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Clivuu GTK desktop service"

[dependencies]
clivuu-core = { path = "../core" }
clivuu-x11 = { path = "x11" }
gtk = { package = "gtk4", version = "=0.10.3", features = ["v4_14"] }
adw = { package = "libadwaita", version = "=0.8.0", features = ["v1_5"] }
pangocairo = "0.21"
serde.workspace = true
serde_json.workspace = true
zbus.workspace = true
async-channel = "2.5"
libc = "0.2"
wl-clipboard-rs = "0.9.5"
gst = { package = "gstreamer", version = "=0.24.2", features = ["v1_20"] }
gst-app = { package = "gstreamer-app", version = "=0.24.2", features = ["v1_20"] }
gst-video = { package = "gstreamer-video", version = "=0.24.2", features = ["v1_20"] }

[[bin]]
name = "clivuu-desktop"
path = "src/main.rs"
