# Test session policy only. Never discover or restore physical device state.
# An explicit profile also makes an unsupported WirePlumber fail, rather than
# silently starting its default hardware-managing profile.
wireplumber.profiles = {
  clivuu-test = {
    inherits = [ policy, mixin.stateless ]
    hardware.audio = disabled
    hardware.bluetooth = disabled
    hardware.video-capture = disabled
    monitor.alsa = disabled
    monitor.alsa-midi = disabled
    monitor.bluez = disabled
    monitor.bluez-midi = disabled
    monitor.v4l2 = disabled
    monitor.libcamera = disabled
    support.reserve-device = disabled
    support.logind = disabled
    support.system-dbus = disabled
  }
}
